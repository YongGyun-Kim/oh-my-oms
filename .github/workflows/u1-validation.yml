name: U1·U2 필수 현재 source 검증
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oms-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  u1:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NODE_ENV: test
      OMS_U2_SYNTHETIC_PROFILE: approved-local-only
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
          package-manager-cache: false
      - run: npm ci
      - run: npm run bootstrap:u2:ci
      - name: U1 전체 현재 회귀와 동일 전체 제품 inventory 기여
        run: node --import tsx scripts/u2/ci-full-proof.ts u1
      - name: U1 성공 원문과 source receipt 보존
        if: success()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: u1-current-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: |
            .reports/project/current-u1-unit.json
            .reports/project/current-u1-integration.json
            .reports/project/current-u1-coverage/coverage-final.json
            .reports/project/current-u1-coverage/evidence.json
            .reports/u2/validation-u1.json
      - name: U1 비민감 종료 요약 보존
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: u1-summary-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: .reports/project/u1-job-summary.json
  u2:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NODE_ENV: test
      OMS_U2_SYNTHETIC_PROFILE: approved-local-only
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
          package-manager-cache: false
      - run: npm ci
      - run: npm run bootstrap:u2:ci
      - run: npx playwright install --with-deps chromium
      - name: U2 unit/integration/PC와 U2-only 기여
        run: node --import tsx scripts/u2/ci-full-proof.ts u2
      - name: U2 성공 원문과 source receipt 보존
        if: success()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: u2-current-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: |
            .reports/u2/unit.json
            .reports/u2/integration.json
            .reports/u2/e2e.json
            .reports/u2/coverage/coverage-final.json
            .reports/u2/coverage/evidence.json
            .reports/u2/validation-u2.json
            .reports/project/u2-job-summary.json
      - name: U2 비민감 종료 요약 보존
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: u2-summary-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: .reports/project/u2-job-summary.json
  project:
    needs: [u1, u2]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NODE_ENV: test
      OMS_U2_SYNTHETIC_PROFILE: approved-local-only
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: 두 필수 job의 실제 성공 확인
        run: test '${{ needs.u1.result }}' = success && test '${{ needs.u2.result }}' = success
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
          package-manager-cache: false
      - run: npm ci
      - run: npm run bootstrap:u1:tools
      - run: npm run bootstrap:u2:ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, 원본 tag 대조
        with:
          pattern: '*-current-${{ github.sha }}'
          merge-multiple: true
          path: .reports
      - name: 한 current source의 전체 합집합·공통 검사·동일 image 보안·50분 부하·복원
        run: node --import tsx scripts/u2/ci-full-proof.ts project
      - name: 최소 최종 결과 보존
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: project-validation-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: |
            .reports/u2/check.json
            .reports/u2/security.json
            .reports/u2/security-policy.json
            .reports/u2/runtime-security.json
            .reports/u2/release-validation.json
            .reports/project/coverage-aggregate.json
            .reports/project/project-job-summary.json

# 실패/취소/skip/누락/SHA·source mismatch는 project release gate를 통과하지
# 못한다. raw trace/ACK/비밀 fixture와 scanner 원문은 업로드하지 않는다.
